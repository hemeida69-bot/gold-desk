<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Gold Desk</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet"/><style>:root{--bg:#f3f5f8;--soft:#eef2f6;--line:#e2e8ef;--text:#1c2430;--muted:#6b7789;--buy:#0f8a56;--sell:#c43c3c;--header:72px}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,sans-serif;overflow:hidden}header{min-height:var(--header);display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}.brand{display:flex;gap:10px;align-items:center}.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(180deg,#f3d37a,#c9a227);display:grid;place-items:center;font-weight:800}.price{font-size:24px;font-weight:700}.up{color:var(--buy)}.down{color:var(--sell)}.meta{color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:8px 12px;font-weight:600}.layout{height:calc(100dvh - 84px);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,1fr)}@media(max-width:980px){.layout{grid-template-columns:1fr;grid-template-rows:38vh 1fr}}.chart-col{min-height:0;padding:12px}.chart-card{height:100%;background:#fff;border:1px solid var(--line);border-radius:20px;display:flex;flex-direction:column;overflow:hidden}.chart{flex:1;min-height:0}.side{overflow:auto;padding:12px}.acc{background:#fff;border:1px solid var(--line);border-radius:18px;margin-bottom:10px}.acc>button{width:100%;display:flex;justify-content:space-between;border:0;background:#fff;padding:13px 14px;font:700 14px Manrope}.acc.closed .body{display:none}.body{padding:0 14px 14px}.zone,.setup,.news-item{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:8px}.zone.done{opacity:.55;text-decoration:line-through}.row{display:flex;justify-content:space-between;align-items:center;margin:3px 0;font-size:13px;gap:8px}.k{color:var(--muted)}.v{font-weight:700}.tag,.badge{font-size:11px;font-weight:700;border-radius:999px;padding:3px 8px}.bsl{background:#fdeeee;color:var(--sell)}.ssl{background:#e8f7ef;color:var(--buy)}.avail{background:#e8f7ef;color:#0f8a56}.blocked{background:#fdeeee;color:#c43c3c}.pending{background:#f8f1de;color:#9a6b12}.note{color:var(--muted);font-size:12px;margin-top:4px;line-height:1.55}.chk{width:18px;height:18px}.toast{position:fixed;bottom:16px;left:16px;right:16px;max-width:420px;margin:auto;background:#fff;border:1px solid #e2c77a;padding:12px;border-radius:14px;display:none}pre.da{white-space:pre-wrap;font:12.5px/1.55 Manrope,system-ui;margin:0}</style></head><body><header><div class="brand"><div class="logo">Au</div><div><b>Gold Desk</b><div class="meta">XAUUSD liquidity map</div></div></div><div><div id="price" class="price">-</div><div class="meta" id="chg">Loading</div></div><div class="meta" id="hl"></div><div><label class="meta"><input id="sniper" type="checkbox"/> Sniper</label> <button class="btn" id="analyze">Analyze</button> <button class="btn" id="alertBtn">Enable alerts</button> <button class="btn" id="reload">Refresh</button></div></header><div class="layout"><section class="chart-col"><div class="chart-card"><h2 style="margin:12px 16px 8px;font-size:14px">Gold chart</h2><div class="chart"><div id="tvchart" style="height:100%"></div></div></div></section><aside class="side"><div class="acc" data-acc="deep"><button type="button">Deep analysis <span>v</span></button><div class="body"><div class="meta" id="lastA">Last analysis: -</div><pre class="da" id="deep">Waiting for live candles...</pre></div></div><div class="acc" data-acc="read"><button type="button">Session read <span>v</span></button><div class="body" id="analysis"></div></div><div class="acc" data-acc="zones"><button type="button">Active liquidity <span>v</span></button><div class="body" id="zones"></div></div><div class="acc" data-acc="setups"><button type="button">Today's 4 setups <span>v</span></button><div class="body" id="setups"></div></div><div class="acc" data-acc="news"><button type="button">Gold-relevant news <span>v</span></button><div class="body" id="news">Loading</div></div></aside></div><div class="toast" id="toast"></div><script src="https://s3.tradingview.com/tv.js"></script><script src="./engine.js"></script></body></html>
